name: HeartGuard CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-and-test:
    name: Lint, Security Scan & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff lint check
        run: ruff check . --select E,F,W --ignore E501,E741

      - name: Validate imports
        run: python -c "import config.settings; import src.utils.logger; print('Imports OK')"

      - name: Validate configuration
        run: python -c "from config.settings import ENVIRONMENT, SECRET_KEY; print(f'Config OK: env={ENVIRONMENT}')"

      - name: Run tests
        env:
          ENVIRONMENT: testing
          DEBUG: "false"
          SECRET_KEY: test-secret-key-for-ci-only
        run: pytest -q --tb=short

      - name: Verify health check script
        env:
          ENVIRONMENT: testing
          SECRET_KEY: test-secret-key-for-ci-only
        run: python scripts/health_check.py --full

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt
        continue-on-error: true

      - name: Check for hardcoded secrets
        run: |
          if grep -rn "password\s*=\s*['\"]" --include="*.py" . | grep -v "test_" | grep -v ".env.example" | grep -v "password_hash" | grep -v "COMMON_PASSWORDS" | grep -v "ADMIN_PASSWORD" | grep -v "REVIEWER_PASSWORD" | grep -v "validate_" | grep -v "password_service"; then
            echo "WARNING: Potential hardcoded passwords found"
            exit 1
          fi
          echo "No hardcoded secrets detected"

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: heartguard:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
